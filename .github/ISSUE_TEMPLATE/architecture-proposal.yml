name: Architecture proposal
description: Propose or clarify a Generation 2 design decision
title: "[Architecture] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What requirement or failure mode should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed approach
      description: Explain the change and competing options.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Trust, compatibility and performance risks
      description: Include failure handling and what would be tested.
  - type: textarea
    id: acceptance
    attributes:
      label: Measurable acceptance criteria
