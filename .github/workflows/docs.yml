name: Documentation checks

on:
  push:
    paths:
      - "**/*.md"
      - "docs/check_links.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/check_links.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check local Markdown links
        run: python3 docs/check_links.py
