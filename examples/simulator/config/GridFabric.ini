; OGL Simulator -> OGL GridFabric — proposed template, NOT a runnable config yet.
; One simulator connects to ONE owning GridFabric/grid in the initial design.

[GridFabric]
Url = "https://grid.example.org:8002"
; Server-side GridFabric HTTPS listener is configured independently.
GridId = "00000000-0000-4000-8000-000000000001"
ProtocolVersion = "1"

[Security]
ValidateServerCertificate = true
; Proposed authentication mechanism. Client cert MUST be uniquely provisioned.
AuthenticationMode = "MutualTLS"
ClientCertificatePath = "/etc/opengenesislink/simulator/tls/simulator-client.pfx"
; Load certificate password from a secret manager / protected environment.
; Never commit private keys, access tokens or passwords in INI files.

[Connection]
ConnectTimeoutSeconds = 10
HeartbeatIntervalSeconds = 20
RegionLeaseSeconds = 90
ReconnectInitialDelaySeconds = 2
ReconnectMaxDelaySeconds = 60
; Actual heartbeat/lease defaults must be validated under load and failures.
