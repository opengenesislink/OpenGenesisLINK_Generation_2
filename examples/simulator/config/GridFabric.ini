; OGL Simulator -> OGL GridFabric — initial .NET 10 bootstrap INI.
; Replace the example endpoint with the real, certificate-valid GridFabric URL.

[GridFabric]
Url = "https://grid.example.org:8002"
GridId = "00000000-0000-4000-8000-000000000001"
ProtocolVersion = "1"

[Security]
ValidateServerCertificate = true
; Initial bootstrap uses one shared, strong token stored exclusively in
; environment variable OGL_GRIDFABRIC_SIMULATOR_TOKEN.
; Per-simulator service identity / mutual TLS is a future milestone.
AuthenticationMode = "BearerToken"

[Connection]
ConnectTimeoutSeconds = 10
HeartbeatIntervalSeconds = 20
RegionLeaseSeconds = 90
ReconnectInitialDelaySeconds = 2
ReconnectMaxDelaySeconds = 60
