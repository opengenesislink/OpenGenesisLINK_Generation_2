; OGL Simulator Generation 2 — proposed template, NOT a runnable config yet.
; Every OGL.Simulator process has its OWN config directory.
; This file describes the simulator runtime only; it does not host GridFabric.

[Simulator]
Name = "OGL Simulator Magdeburg Node"
InstanceId = "sim-node-mag-01"
Enabled = true
RegionsDirectory = "Regions"
GridConnectionFile = "GridFabric.ini"

[Network]
; An interface reachable by local clients / routing infrastructure.
BindAddress = "0.0.0.0"
; Do not confuse simulator network listeners with GridFabric HTTPS :8002.
AdvertisedHost = "sim1.example.org"

[Runtime]
; Planned simulation plugins; module identifiers to be finalized.
PhysicsProvider = "OGLPhysics"
ScriptProvider = "OGLScript"
MaxRegions = 16
; MaxRegions is an OPERATOR LIMIT, not a promise that 16 regions fit any host.

[Logging]
Level = "Information"
